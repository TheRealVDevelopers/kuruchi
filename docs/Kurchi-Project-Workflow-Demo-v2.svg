<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Kurchi Projects: From showroom plan to handover</title>
  <desc id="d">A premium dark presentation infographic showing the six-step Kurchi project workflow, roles and outcomes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1c"/><stop offset=".55" stop-color="#101d3a"/><stop offset="1" stop-color="#081b25"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#3b82f6"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <filter id="drop" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".32"/></filter>
    <style>
      .kicker{font:700 15px Arial,sans-serif;letter-spacing:3px;fill:#67e8f9}.h1{font:700 50px Arial,sans-serif;fill:#f8fafc}.intro{font:400 20px Arial,sans-serif;fill:#a9b7ce}.step{font:700 15px Arial,sans-serif;letter-spacing:1.6px;fill:#94a3b8}.cardtitle{font:700 24px Arial,sans-serif;fill:#f8fafc}.copy{font:400 16px Arial,sans-serif;fill:#bdc8da}.role{font:700 13px Arial,sans-serif;letter-spacing:1.1px;fill:#dbeafe}.bottomtitle{font:700 22px Arial,sans-serif;fill:#f8fafc}.bottomcopy{font:400 16px Arial,sans-serif;fill:#cbd5e1}.number{font:700 18px Arial,sans-serif;fill:#06121d}.tiny{font:700 13px Arial,sans-serif;letter-spacing:1px;fill:#e0f2fe}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1730" cy="-80" r="390" fill="#8b5cf6" opacity=".10"/><circle cx="-60" cy="1060" r="390" fill="#06b6d4" opacity=".08"/>
  <path d="M112 112H1808" stroke="url(#glow)" stroke-width="3" opacity=".9"/>
  <text x="112" y="177" class="kicker">KURCHI PROJECTS</text>
  <text x="112" y="238" class="h1">One clear journey: project to handover.</text>
  <text x="112" y="276" class="intro">Everyone gets the right screen, the right work, and live project visibility.</text>

  <!-- timeline line -->
  <path d="M208 473H1712" stroke="#2a3b59" stroke-width="4" stroke-linecap="round"/>
  <path d="M208 473H1712" stroke="url(#glow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 20" opacity=".8"/>

  <!-- Card 1 -->
  <g filter="url(#drop)"><rect x="112" y="355" width="254" height="370" rx="24" fill="#15233d" stroke="#263b5d"/></g>
  <circle cx="158" cy="404" r="26" fill="url(#glow)"/><text x="152" y="411" class="number">1</text>
  <rect x="190" y="386" width="130" height="30" rx="15" fill="#1d4f73"/><text x="207" y="406" class="role">ADMIN</text>
  <text x="140" y="478" class="step">START HERE</text><text x="140" y="517" class="cardtitle">Create a</text><text x="140" y="547" class="cardtitle">showroom project</text>
  <text x="140" y="594" class="copy">Add the client, location,</text><text x="140" y="620" class="copy">dates and project team.</text>
  <rect x="140" y="664" width="198" height="34" rx="17" fill="#223451"/><text x="159" y="686" class="tiny">CLIENT + SITE ADDED</text>

  <!-- Card 2 -->
  <g filter="url(#drop)"><rect x="402" y="355" width="254" height="370" rx="24" fill="#15233d" stroke="#263b5d"/></g>
  <circle cx="448" cy="404" r="26" fill="url(#glow)"/><text x="442" y="411" class="number">2</text>
  <rect x="480" y="386" width="146" height="30" rx="15" fill="#553c7c"/><text x="496" y="406" class="role">ADMIN + CLIENT</text>
  <text x="430" y="478" class="step">PLAN</text><text x="430" y="517" class="cardtitle">Build BOQ &amp;</text><text x="430" y="547" class="cardtitle">get approval</text>
  <text x="430" y="594" class="copy">Add products, quantities</text><text x="430" y="620" class="copy">and quote. Client approves.</text>
  <rect x="430" y="664" width="190" height="34" rx="17" fill="#223451"/><text x="449" y="686" class="tiny">APPROVE / CHANGES</text>

  <!-- Card 3 -->
  <g filter="url(#drop)"><rect x="692" y="355" width="254" height="370" rx="24" fill="#15233d" stroke="#263b5d"/></g>
  <circle cx="738" cy="404" r="26" fill="url(#glow)"/><text x="732" y="411" class="number">3</text>
  <rect x="770" y="386" width="137" height="30" rx="15" fill="#285968"/><text x="786" y="406" class="role">ADMIN + VENDOR</text>
  <text x="720" y="478" class="step">MAKE &amp; MOVE</text><text x="720" y="517" class="cardtitle">Source and</text><text x="720" y="547" class="cardtitle">ship items</text>
  <text x="720" y="594" class="copy">Create PO. Track making,</text><text x="720" y="620" class="copy">packing, dispatch, delivery.</text>
  <rect x="720" y="664" width="190" height="34" rx="17" fill="#223451"/><text x="743" y="686" class="tiny">TRACK EVERY ITEM</text>

  <!-- Card 4 -->
  <g filter="url(#drop)"><rect x="982" y="355" width="254" height="370" rx="24" fill="#15233d" stroke="#263b5d"/></g>
  <circle cx="1028" cy="404" r="26" fill="url(#glow)"/><text x="1022" y="411" class="number">4</text>
  <rect x="1060" y="386" width="112" height="30" rx="15" fill="#754a26"/><text x="1077" y="406" class="role">ACCOUNTS</text>
  <text x="1010" y="478" class="step">DOCUMENT</text><text x="1010" y="517" class="cardtitle">Manage billing</text><text x="1010" y="547" class="cardtitle">and documents</text>
  <text x="1010" y="594" class="copy">Invoice, vendor bill,</text><text x="1010" y="620" class="copy">challan and E-way bill.</text>
  <rect x="1010" y="664" width="190" height="34" rx="17" fill="#223451"/><text x="1030" y="686" class="tiny">PAYMENTS + TAX</text>

  <!-- Card 5 -->
  <g filter="url(#drop)"><rect x="1272" y="355" width="254" height="370" rx="24" fill="#123a3e" stroke="#2dd4bf" stroke-width="2"/></g>
  <circle cx="1318" cy="404" r="26" fill="url(#glow)"/><text x="1312" y="411" class="number">5</text>
  <rect x="1350" y="386" width="145" height="30" rx="15" fill="#12666d"/><text x="1366" y="406" class="role">INSTALLATION</text>
  <text x="1300" y="478" class="step">ON SITE · MOBILE</text><text x="1300" y="517" class="cardtitle">Receive, fit</text><text x="1300" y="547" class="cardtitle">and update</text>
  <text x="1300" y="594" class="copy">Confirm delivery, fit items,</text><text x="1300" y="620" class="copy">share photos, report issues.</text>
  <rect x="1300" y="664" width="190" height="34" rx="17" fill="#155660"/><text x="1322" y="686" class="tiny">SIMPLE 1-TAP STATUS</text>

  <!-- Card 6 -->
  <g filter="url(#drop)"><rect x="1562" y="355" width="246" height="370" rx="24" fill="#15233d" stroke="#263b5d"/></g>
  <circle cx="1608" cy="404" r="26" fill="url(#glow)"/><text x="1602" y="411" class="number">6</text>
  <rect x="1640" y="386" width="130" height="30" rx="15" fill="#1d4f73"/><text x="1659" y="406" class="role">CLIENT</text>
  <text x="1590" y="478" class="step">FINISH</text><text x="1590" y="517" class="cardtitle">Handover and</text><text x="1590" y="547" class="cardtitle">close project</text>
  <text x="1590" y="594" class="copy">Client sees progress, photos</text><text x="1590" y="620" class="copy">and final completion.</text>
  <rect x="1590" y="664" width="184" height="34" rx="17" fill="#223451"/><text x="1611" y="686" class="tiny">PROJECT COMPLETE</text>

  <!-- Lower information panels -->
  <g filter="url(#drop)"><rect x="112" y="810" width="810" height="158" rx="25" fill="#142541" stroke="#2f4a70"/></g>
  <rect x="144" y="843" width="170" height="34" rx="17" fill="#1d4f73"/><text x="164" y="865" class="role">CLIENT VIEW</text>
  <text x="144" y="916" class="bottomtitle">The client sees only what matters.</text>
  <text x="144" y="946" class="bottomcopy">Approvals • delivery progress • site photos • installation updates • completion</text>

  <g filter="url(#drop)"><rect x="962" y="810" width="846" height="158" rx="25" fill="#143b42" stroke="#2dd4bf"/></g>
  <rect x="994" y="843" width="195" height="34" rx="17" fill="#12666d"/><text x="1014" y="865" class="role">ADMIN VIEW</text>
  <text x="994" y="916" class="bottomtitle">The Admin stays in control from one dashboard.</text>
  <text x="994" y="946" class="bottomcopy">Project progress • material status • spend • invoices • issues • margin and profit</text>
  <text x="112" y="1026" class="intro">Kurchi Projects makes showroom execution easy to manage—from office, vendor, site and client.</text>
</svg>
